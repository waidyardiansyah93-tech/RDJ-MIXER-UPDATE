
name: RDJ MIXER Windows Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022"
          -A x64

      - name: Build RDJ MIXER
        run: cmake --build build --config Release --parallel

      - name: Check build output
        shell: pwsh
        run: |
          $folder = "build/DM16_artefacts/Release"

          if (!(Test-Path "$folder/DM-16 Digital Mixer.exe")) {
            Write-Error "DM-16 Digital Mixer.exe tidak ditemukan"
            Get-ChildItem build -Recurse -Filter "*.exe"
            exit 1
          }

          if (!(Test-Path "$folder/RDJ_VST3_Scanner.exe")) {
            Write-Error "RDJ_VST3_Scanner.exe tidak ditemukan"
            Get-ChildItem build -Recurse -Filter "*.exe"
            exit 1
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RDJ-MIXER-Windows-x64
          path: build/DM16_artefacts/Release/
          if-no-files-found: error

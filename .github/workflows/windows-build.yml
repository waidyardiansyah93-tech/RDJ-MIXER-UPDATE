
name: RDJ MIXER Windows Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      # 1. Mengambil source dari GitHub
      - name: Checkout source
        uses: actions/checkout@v4

      # 2. Menyiapkan compiler Microsoft C++
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # 3. Memasang Ninja
      - name: Setup Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # 4. Konfigurasi CMake
      - name: Configure CMake
        run: >
          cmake -S . -B build
          -G Ninja
          -DCMAKE_BUILD_TYPE=Release

      # 5. Build RDJ MIXER dan VST3 Scanner
      - name: Build RDJ MIXER
        run: cmake --build build --config Release --parallel

      # 6. Memeriksa hasil build
      - name: Check build output
        shell: pwsh
        run: |
          $folder = "build/DM16_artefacts/Release"

          Write-Host "Memeriksa file RDJ MIXER..."

          if (!(Test-Path "$folder/DM-16 Digital Mixer.exe")) {
            Write-Error "DM-16 Digital Mixer.exe tidak ditemukan"
            Get-ChildItem build -Recurse -Filter "*.exe"
            exit 1
          }

          if (!(Test-Path "$folder/RDJ_VST3_Scanner.exe")) {
            Write-Error "RDJ_VST3_Scanner.exe tidak ditemukan"
            Get-ChildItem build -Recurse -Filter "*.exe"
            exit 1
          }

          Write-Host "Semua file EXE berhasil ditemukan."

      # 7. Mengunggah hasil build
      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: RDJ-MIXER-Windows-x64
          path: build/DM16_artefacts/Release/
          if-no-files-found: error
